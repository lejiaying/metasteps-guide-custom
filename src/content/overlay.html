  <aside class="demo-control" aria-label="Demoansicht">
    <button id="demo-toggle" class="demo-toggle" type="button" aria-expanded="false">DEMO</button>
    <div id="demo-menu" class="demo-menu" hidden>
      <label for="scene-select">Erkennung testen</label>
      <select id="scene-select">
        <option value="auto">Echte Ansicht</option>
        <option value="entry">Eingang</option>
        <option value="explore">Bewegung</option>
        <option value="before">Vor dem Objekt</option>
        <option value="selected">Objekt ausgewählt</option>
        <option value="camera">Kamera ausgerichtet</option>
        <option value="object">Große Objektansicht</option>
        <option value="info">Informationen geöffnet</option>
        <option value="zoomed">Objekt vergrößert</option>
        <option value="map">Karte geöffnet</option>
        <option value="object1">Objekt 1</option>
        <option value="object2">Objekt 2</option>
        <option value="object3">Objekt 3</option>
        <option value="object4">Objekt 4</option>
        <option value="object5">Objekt 5</option>
        <option value="object6">Objekt 6</option>
        <option value="unknown">Unklare Ansicht</option>
      </select>
    </div>
  </aside>

  <section id="home-panel" class="panel home-panel" aria-labelledby="home-title">
    <h1 id="home-title">Wie kann ich Ihnen helfen?</h1>
    <div class="service-grid">
      <button class="service-button" data-flow="start" type="button"><span class="service-icon" data-icon="start"></span><span>Wie fange ich an?</span></button>
      <button class="service-button" data-flow="move" type="button"><span class="service-icon" data-icon="move"></span><span>Ich möchte mich im Raum bewegen.</span></button>
      <button class="service-button" data-flow="exhibit" type="button"><span class="service-icon" data-icon="exhibit"></span><span>Ich stehe vor einem Ausstellungsstück.</span></button>
      <button class="service-button" data-flow="lost" type="button"><span class="service-icon" data-icon="lost"></span><span>Ich habe mich verirrt.</span></button>
    </div>
    <button id="recognize-button" class="recognize-button" type="button"><span class="small-icon" data-icon="scan"></span><span>Was kann ich hier tun?</span></button>
    <button id="home-close" class="ack-button home-ack" type="button">OK, danke.</button>
  </section>

  <div id="target-marker" class="target-marker" hidden aria-hidden="true"></div>

  <section id="guide-card" class="panel guide-card" hidden aria-live="polite">
    <div id="guide-copy" class="guide-copy">
      <p id="guide-progress" class="guide-progress"></p>
      <h2 id="guide-title"></h2>
      <div class="guide-message"><span id="guide-step-icon" class="step-icon" aria-hidden="true"></span><span class="small-icon guide-audio-icon" data-icon="speaker" aria-hidden="true"></span><p id="guide-text" class="guide-text"></p></div>
      <div id="guide-choices" class="guide-choices" hidden></div>
      <button id="guide-ack" class="ack-button" type="button" hidden>OK, danke.</button>
    </div>
    <div id="guide-extra" class="guide-extra" hidden></div>
    <div id="locator-retry" class="locator-retry" hidden>
      <p id="locator-message">Bitte halten Sie das Ziel vollständig sichtbar.</p>
      <button id="locator-retry-button" class="secondary-button" type="button">Erneut versuchen</button>
    </div>
  </section>

  <div id="scene-annotations" class="scene-annotations" hidden aria-hidden="true"></div>

  <section id="recognition-panel" class="panel recognition-panel" hidden aria-live="assertive">
    <div id="recognition-spinner" class="recognition-spinner"></div>
    <span id="recognition-icon" class="recognition-icon" hidden></span>
    <h2 id="recognition-title">Einen Moment bitte.</h2>
    <p id="recognition-text">Ich sehe mir Ihre Ansicht an.</p>
    <p id="recognition-confidence" class="recognition-confidence" hidden></p>
    <div id="recognition-actions" class="recognition-actions" hidden>
      <button id="recognition-accept" class="primary-button" type="button">Ja, weiter</button>
      <button id="recognition-reject" class="secondary-button" type="button">Nein, Hilfe auswählen</button>
    </div>
  </section>

  <button id="help-pill" class="help-pill" type="button" hidden><span class="small-icon" data-icon="help"></span><span>Hilfe</span></button>
</div>
